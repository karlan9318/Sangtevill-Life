services:
  santeville-life:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santeville-life-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - santeville_data:/app/data

volumes:
  santeville_data:
    driver: local
